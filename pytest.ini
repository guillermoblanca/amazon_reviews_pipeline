[pytest]
# =============================================================================
# pytest.ini — Configuración de la suite de tests
# =============================================================================

# Directorio raíz de los tests
testpaths = tests

# Formato de salida detallado: muestra cada test con PASSED/FAILED
addopts =
    --verbose
    --tb=short
    --no-header
    -p no:cacheprovider

# Marcadores personalizados (evita warnings de marcadores desconocidos)
markers =
    integration: Tests que requieren la API levantada y el modelo cargado
    unit: Tests unitarios sin dependencias externas
    slow: Tests que tardan más de 30s (ej. los que usan SparkSession)

# Logging durante los tests
log_cli = true
log_cli_level = WARNING
log_format = %(asctime)s %(levelname)s %(message)s
log_date_format = %H:%M:%S
